<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>武汉IT企业智能评级看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;--card:#131c31;--line:#223052;--txt:#e2e8f0;--dim:#8ea0bd;
  --acc:#38bdf8;--ok:#22c55e;--err:#ef4444;
}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;padding:18px 20px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.status.err .dot{background:var(--err);animation:none}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.source{display:flex;gap:6px}
#srcPath{background:#0f1830;border:1px solid var(--line);color:var(--txt);border-radius:8px;
  padding:6px 10px;width:300px;font-size:12px;outline:none}
#srcPath:focus{border-color:var(--acc)}
#srcBtn{background:#1e293b;border:1px solid var(--line);color:#cfe3ff;border-radius:8px;
  padding:6px 14px;font-size:12px;cursor:pointer;white-space:nowrap}
#srcBtn:hover{background:#243353;border-color:var(--acc)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d;
  border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi-v{font-size:30px;font-weight:700;color:var(--acc)}
.kpi-l{color:var(--dim);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card.wide{grid-column:1/-1}
.card-h{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#cfe3ff}
.vwrap{height:210px;display:flex;align-items:flex-end;gap:10px;padding-top:18px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px;min-width:0}
.vval{font-size:11px;color:var(--dim)}
.vbar{width:min(46px,70%);border-radius:6px 6px 0 0;min-height:2px;transition:height .4s ease}
.vlabel{font-size:11px;color:var(--dim);white-space:nowrap;margin-top:2px}
.hwrap{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;padding-right:4px}
.hrow{display:flex;align-items:center;gap:10px;font-size:12px}
.hlab{width:130px;flex:none;text-align:right;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htrack{flex:1;height:18px;background:#0f1830;border-radius:9px;overflow:hidden}
.hfill{height:100%;border-radius:9px;min-width:2px;transition:width .4s ease}
.hval{width:34px;flex:none;color:var(--dim);font-size:12px;text-align:left}
.table-wrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#182240;color:#cfe3ff;text-align:left;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;z-index:1}
thead th[data-k]{cursor:pointer}
thead th[data-k]:hover{color:#fff}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{border-bottom:1px solid #1a2745;cursor:pointer}
tbody tr:hover{background:#182747}
td{padding:9px 12px;vertical-align:middle}
.cname{font-weight:600;color:#e2e8f0}
.tags{color:var(--dim);max-width:340px}
.dim{color:var(--dim);white-space:nowrap;font-size:12px}
.badge{display:inline-block;min-width:26px;text-align:center;color:#fff;font-weight:700;
  border-radius:6px;padding:2px 8px;font-size:12px}
#search{background:#0f1830;border:1px solid var(--line);color:var(--txt);border-radius:8px;
  padding:6px 12px;width:240px;font-size:13px;outline:none}
#search:focus{border-color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(2,8,20,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
[hidden]{display:none !important}
.modal-box{background:var(--card);border:1px solid #2c3d66;border-radius:14px;max-width:760px;width:100%;
  max-height:86vh;overflow-y:auto;padding:22px 24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;
  font-size:18px;font-weight:700}
#mClose{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
#mClose:hover{color:#fff;background:#1e2c4d}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;font-size:13px;margin-bottom:14px}
.m-l{color:var(--dim);font-size:12px;margin-bottom:2px}
.m-sec{font-size:13px;font-weight:600;color:#cfe3ff;margin:14px 0 8px;border-left:3px solid var(--acc);padding-left:8px}
.m-text{font-size:13px;color:#cbd5e1;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.m-scores{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;font-size:12px}
.slab{width:64px;flex:none;color:var(--dim)}
.strack{flex:1;height:14px;background:#0f1830;border-radius:7px;overflow:hidden}
.sfill{height:100%;background:linear-gradient(90deg,#38bdf8,#818cf8);border-radius:7px;min-width:2px}
.sval{width:52px;flex:none;color:#cbd5e1}
.tag{display:inline-block;background:#12314d;color:#7dd3fc;border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.tag.alt{background:#3b1d3f;color:#e9a6f2}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2c3d66;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header>
  <div>
    <h1>武汉IT企业智能评级 · 实时看板</h1>
    <div class="sub" id="subInfo">数据文件: all_rated_companies.xlsx | 加载中...</div>
  </div>
  <div class="header-right">
    <div class="source">
      <input id="srcPath" placeholder="粘贴 all_rated_companies.xlsx 或 .csv 路径...">
      <button id="srcBtn">载入</button>
    </div>
    <div class="status" id="status"><span class="dot"></span>连接中...</div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<section class="kpis" id="kpis"></section>

<section class="grid">
  <div class="card">
    <div class="card-h">评级分布 (A/B/C/D)</div>
    <div class="vwrap" id="ratingChart"></div>
  </div>
  <div class="card">
    <div class="card-h">总分分布 (10分一档)</div>
    <div class="vwrap" id="scoreChart"></div>
  </div>
  <div class="card">
    <div class="card-h">行业标签 Top 15</div>
    <div class="hwrap" id="tagChart"></div>
  </div>
  <div class="card">
    <div class="card-h">融资阶段分布</div>
    <div class="vwrap" id="fundChart"></div>
  </div>
  <div class="card wide">
    <div class="card-h">总分 Top 15 企业</div>
    <div class="hwrap" id="topChart"></div>
  </div>
</section>

<section class="card wide">
  <div class="card-h">
    企业明细
    <input id="search" placeholder="搜索企业名 / 行业 / 经营范围...">
  </div>
  <div class="table-wrap">
    <table id="tbl">
      <thead><tr>
        <th data-k="name">公司名称</th>
        <th data-k="score" class="num">总分</th>
        <th data-k="rating">评级</th>
        <th>行业标签</th>
        <th data-k="funding">融资阶段</th>
        <th>注册资本</th>
        <th data-k="crawl">抓取时间</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div id="mName"></div>
      <button id="mClose">✕</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const RATING_COLOR = {A:'#22c55e', B:'#3b82f6', C:'#f59e0b', D:'#ef4444', '—':'#64748b'};
let lastFp = null, companies = [];
let sortKey = 'score', sortDir = -1, searchQ = '';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function basename(p){return (p||'').split(/[\\/]/).pop()||p||'';}

function vbar(el, items, color){
  el.innerHTML='';
  const max=Math.max(...items.map(i=>i.value),1);
  items.forEach(it=>{
    const col=document.createElement('div'); col.className='vcol'; col.title=it.label+': '+it.value;
    const v=document.createElement('div'); v.className='vval'; v.textContent=it.value;
    const bar=document.createElement('div'); bar.className='vbar';
    bar.style.height=(it.value/max*100)+'%';
    bar.style.background=typeof color==='function'?color(it):color;
    const l=document.createElement('div'); l.className='vlabel'; l.textContent=it.label;
    col.append(v,bar,l); el.appendChild(col);
  });
}
function hbar(el, items, color){
  el.innerHTML='';
  const max=Math.max(...items.map(i=>i.value),1);
  items.forEach(it=>{
    const row=document.createElement('div'); row.className='hrow'; row.title=it.label+': '+it.value;
    const lab=document.createElement('div'); lab.className='hlab'; lab.textContent=it.label;
    const track=document.createElement('div'); track.className='htrack';
    const fill=document.createElement('div'); fill.className='hfill';
    fill.style.width=(it.value/max*100)+'%';
    fill.style.background=typeof color==='function'?color(it):color;
    track.appendChild(fill);
    const val=document.createElement('div'); val.className='hval'; val.textContent=it.value;
    row.append(lab,track,val); el.appendChild(row);
  });
}

function render(data){
  const cs=data.companies||[];
  const scores=cs.map(c=>c.score);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const top=cs.reduce((a,b)=>b.score>a.score?b:a,{score:0,name:'—'});
  const rated=cs.filter(c=>c.rating!=='—');
  const ab=rated.filter(c=>c.rating==='A'||c.rating==='B').length;
  $('#kpis').innerHTML=
    '<div class="kpi"><div class="kpi-v">'+cs.length+'</div><div class="kpi-l">企业总数</div></div>'+
    '<div class="kpi"><div class="kpi-v">'+avg.toFixed(1)+'</div><div class="kpi-l">平均总分</div></div>'+
    '<div class="kpi"><div class="kpi-v">'+top.score+'</div><div class="kpi-l" title="'+esc(top.name)+'">最高分 · '+esc(top.name)+'</div></div>'+
    '<div class="kpi"><div class="kpi-v">'+(rated.length?Math.round(ab/rated.length*100):0)+'%</div><div class="kpi-l">A/B 级占比</div></div>';

  const rc={A:0,B:0,C:0,D:0};
  cs.forEach(c=>{if(rc[c.rating]!=null)rc[c.rating]++;});
  const rItems=['A','B','C','D'].map(k=>({label:k,value:rc[k]}));
  const miss=cs.length-rItems.reduce((s,i)=>s+i.value,0);
  if(miss>0) rItems.push({label:'—',value:miss});
  vbar($('#ratingChart'), rItems, it=>RATING_COLOR[it.label]||'#64748b');

  const buckets=Array.from({length:10},(_,i)=>''+(i*10)+'~'+(i*10+9));
  const bc=new Array(10).fill(0);
  cs.forEach(c=>{bc[Math.min(9,Math.floor(c.score/10))]++;});
  vbar($('#scoreChart'), buckets.map((l,i)=>({label:l,value:bc[i]})),
       it=>'hsl('+(195+Math.floor(parseInt(it.label)/10)*12)+',70%,55%)');

  const tagc={};
  cs.forEach(c=>(c.tags||[]).forEach(t=>{tagc[t]=(tagc[t]||0)+1;}));
  const tItems=Object.entries(tagc).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([l,v])=>({label:l,value:v}));
  hbar($('#tagChart'), tItems, '#06b6d4');

  const fc={};
  cs.forEach(c=>{const k=c.funding||'—';fc[k]=(fc[k]||0)+1;});
  const fItems=['A','B','C','D','—'].filter(k=>fc[k]).map(k=>({label:k,value:fc[k]}));
  vbar($('#fundChart'), fItems, it=>RATING_COLOR[it.label]||'#64748b');

  const tops=[...cs].sort((a,b)=>b.score-a.score).slice(0,15);
  hbar($('#topChart'), tops.map(c=>({label:c.name,value:c.score})),
       it=>'hsl('+Math.max(0,Math.min(120,it.value))+',72%,55%)');

  buildTable();
}

function buildTable(){
  let rows=companies.filter(c=>{
    if(!searchQ) return true;
    const hay=(c.name+' '+(c.tags||[]).join(' ')+' '+(c.scope||'')).toLowerCase();
    return hay.indexOf(searchQ)>=0;
  });
  rows=rows.slice().sort((a,b)=>{
    const va=a[sortKey], vb=b[sortKey];
    if(sortKey==='score') return (va-vb)*sortDir;
    return String(va).localeCompare(String(vb),'zh')*sortDir;
  });
  const tb=$('#tbody'); tb.innerHTML='';
  rows.forEach(c=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="cname">'+esc(c.name)+'</td>'+
      '<td class="num">'+c.score+'</td>'+
      '<td><span class="badge" style="background:'+(RATING_COLOR[c.rating]||'#64748b')+'">'+esc(c.rating)+'</span></td>'+
      '<td class="tags">'+(c.tags||[]).map(esc).join(' · ')+'</td>'+
      '<td>'+esc(c.funding)+'</td>'+
      '<td>'+esc(c.capital)+'</td>'+
      '<td class="dim">'+esc(c.crawl)+'</td>';
    tr.onclick=()=>showDetail(c);
    tb.appendChild(tr);
  });
}

function scoreBar(label,val,max){
  const pct=Math.min(100,val/max*100);
  return '<div class="srow"><span class="slab">'+label+'</span>'+
    '<span class="strack"><span class="sfill" style="width:'+pct+'%"></span></span>'+
    '<span class="sval">'+val+'/'+max+'</span></div>';
}

function showDetail(c){
  $('#mName').innerHTML=esc(c.name)+' <span class="badge" style="background:'+(RATING_COLOR[c.rating]||'#64748b')+'">'+esc(c.rating)+'级 · '+c.score+'分</span>';
  $('#mBody').innerHTML=
    '<div class="m-grid">'+
      '<div><div class="m-l">注册资本</div><div>'+esc(c.capital)+'</div></div>'+
      '<div><div class="m-l">融资阶段</div><div>'+esc(c.funding)+'</div></div>'+
      '<div><div class="m-l">注册地址</div><div>'+esc(c.address)+'</div></div>'+
      '<div><div class="m-l">抓取时间</div><div>'+esc(c.crawl)+'</div></div>'+
    '</div>'+
    '<div class="m-sec">评分构成</div>'+
    '<div class="m-scores">'+
      scoreBar('技术投入',c.tech,30)+scoreBar('资金实力',c.fund,20)+
      scoreBar('转型意愿',c.intent,25)+scoreBar('团队规模',c.team,15)+scoreBar('行业匹配',c.ind,10)+
    '</div>'+
    '<div class="m-sec">行业标签</div><div>'+(c.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')||'—'+'</div>'+
    '<div class="m-sec">需求标签</div><div>'+(c.demand||[]).map(t=>'<span class="tag alt">'+esc(t)+'</span>').join('')||'—'+'</div>'+
    '<div class="m-sec">经营 / 业务范围</div><div class="m-text">'+esc(c.scope)+'</div>'+
    '<div class="m-sec">销售话术</div><div class="m-text">'+esc(c.pitch)||'—'+'</div>'+
    '<div class="m-sec">评级理由</div><div class="m-text">'+esc(c.reason)||'—'+'</div>';
  $('#modal').hidden=false;
}

document.querySelectorAll('#tbl th[data-k]').forEach(th=>{
  th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir*=-1;
    else {sortKey=k; sortDir=(k==='name'||k==='crawl')?1:-1;}
    buildTable();
  };
});
$('#search').addEventListener('input',e=>{searchQ=e.target.value.trim().toLowerCase();buildTable();});
$('#srcBtn').onclick=async()=>{
  const p=$('#srcPath').value.trim(); if(!p) return;
  const st=$('#status');
  st.className='status'; st.innerHTML='<span class="dot"></span>正在载入...';
  try{
    const res=await fetch('/api/source',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})});
    const r=await res.json();
    if(r.ok){lastFp=null;poll();}
    else{st.className='status err';st.innerHTML='<span class="dot"></span>'+(r.error||'载入失败');
      $('#banner').hidden=false;$('#banner').textContent='⚠ '+(r.error||'载入失败');}
  }catch(e){st.className='status err';st.innerHTML='<span class="dot"></span>载入失败, 请确认看板服务在运行';}
};
$('#srcPath').addEventListener('keydown',e=>{if(e.key==='Enter')$('#srcBtn').click();});
$('#mClose').onclick=()=>{$('#modal').hidden=true;};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true;});

async function poll(){
  const st=$('#status');
  try{
    const res=await fetch('/api/data?t='+Date.now());
    const data=await res.json();
    $('#banner').hidden=!data.warning;
    $('#banner').textContent=data.warning?('⚠ '+data.warning):'';
    if(data.fingerprint && data.fingerprint!==lastFp){
      lastFp=data.fingerprint;
      companies=data.companies||[];
      render(data);
    }
    st.className='status ok';
    st.innerHTML='<span class="dot"></span>自动刷新中 · 文件最后更新: '+(data.mtime||'—');
    $('#subInfo').textContent='数据文件: '+(basename(data.source)||'all_rated_companies.xlsx')+' | 共 '+(data.total||0)+' 家企业 | 每 3 秒自动检测文件变化';
    if(document.activeElement!==$('#srcPath')) $('#srcPath').value=data.source||'';
  }catch(e){
    st.className='status err';
    st.innerHTML='<span class="dot"></span>连接失败, 正在重试...';
  }
}
setInterval(poll,3000);
poll();
</script>
</body>
</html>
